# ICCS 앱 서버 배포용 KMS(API + 워커). 절차·사전 준비는 deploy/README.md.
#
# 서버 디렉터리(/app/isac-cc-application/backend/kms)에 이 파일과 함께 두 파일이 있어야 한다:
#   .env     — compose 치환값(KMS_IMAGE·KMS_API_PORT). deploy-docker.sh가 쓴다.
#   kms.env  — 앱 설정(DB·Redis·OpenSearch·모델 키). 사람이 둔다. 틀은 deploy/kms.env.example.
#
# 워커는 프로필로 분리돼 기본 기동에서 빠진다 — 워커를 맡은 서버 한 대에서만 `--profile worker`로 띄운다.

x-kms-common: &kms-common
  image: ${KMS_IMAGE:?KMS_IMAGE가 필요합니다}
  env_file: kms.env
  environment:
    TZ: Asia/Seoul
    # DB에 업로드 원본의 절대경로가 저장되므로 API·워커가 같은 경로로 같은 NAS를 봐야 한다.
    BLOB_STORAGE_DIR: /data/nas/cc-app/kms/blob
  user: "1001:1002"
  volumes:
    - /data/nas/cc-app:/data/nas/cc-app
  restart: unless-stopped
  logging:
    options:
      max-size: 100m
      max-file: "3"
  networks:
    - isac-cc-application-network

services:
  kms-api:
    <<: *kms-common
    container_name: kms-api
    # 포트는 열지 않는다 — 인증이 없는 API라 같은 도커 네트워크의 customer-service만 kms-api:<포트>로 부른다.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${KMS_API_PORT:-8000}"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${KMS_API_PORT:-8000}/metrics', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  kms-worker:
    <<: *kms-common
    container_name: kms-worker
    profiles: [worker]
    command: ["arq", "rag.worker.WorkerSettings"]
    # docling 변환 정상상태 실측(약 2.4GB)에 여유를 둔 상한. 넘으면 커널이 이 컨테이너만 죽이고 restart가 되살린다.
    mem_limit: 3g

networks:
  isac-cc-application-network:
    external: true
