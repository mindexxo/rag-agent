# 서빙 관측 스택 (#129): Prometheus + Grafana — worker20 상주(개발계 DB/Redis와 같은 호스트).
#
# 역할 분담: Phoenix(docker-compose.local.yml, OTel 트레이스)는 "요청 한 건이 어떻게
# 동작했나", 이 스택은 "시스템이 지금 어떤 상태인가"(시계열) — 서로 대체하지 않는다.
# vLLM·TEI(worker15)는 Prometheus 형식 /metrics를 이미 자체 노출하므로(실측 9/4, prefix
# cache 히트율 61.6% 확인) 스크레이프만 하면 되고, 앱 지표는 main.py의 /metrics가 노출한다.
#
# network_mode: host — 루트 docker-compose.yml(앱)과 같은 이유: 사내망 vLLM·TEI에 호스트와
# 동일하게 접근 + 앱(host:8000)을 localhost로 스크레이프.
#
# 기동: docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus UI :9090 / Grafana :3000 (worker20에서 3000 포트 선점 여부 기동 전 확인)
# GRAFANA_ADMIN_PASSWORD는 같은 디렉터리 .env(gitignore)에 — 커밋 금지(config.py 비밀값 규칙).

services:
  prometheus:
    image: prom/prometheus:v3.5.0   # LTS 핀 — 기동 전 태그 존재 확인
    network_mode: host
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0   # 핀 — 기동 전 태그 존재 확인
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?monitoring용 .env에 설정 필요}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus_data: {}
  grafana_data: {}
