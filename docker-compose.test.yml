# 테스트 전용 로컬 인프라 — pytest가 붙는 DB·Redis·OpenSearch.
#
# 직접 띄울 필요는 없다: 루트 conftest.py가 세션 시작마다 `up -d --wait`를 부른다.
# 수동으로는 `docker compose -f docker-compose.test.yml up -d --wait`, 끄려면 `down`.
# 데이터는 tmpfs라 컨테이너를 다시 만들면 빈 상태(+schema.sql)로 돌아온다.
# 포트는 개발용 compose(5432·6379·9200)와 겹치지 않게 비켜 둔다 — 바꾸면 conftest.py의 주소도 같이 바꾼다.
name: kms-test

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # 비밀번호 없이 붙는다 — 포트를 127.0.0.1에만 열고 데이터는 테스트용이라 지킬 것이 없다
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: kms
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off",
              "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kms"]   # TCP로 본다 — initdb 중 임시 서버는 소켓만 연다
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  opensearch:
    build:
      context: .
      dockerfile: Dockerfile.opensearch
    image: kms-opensearch:2.18.0-nori
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports: ["127.0.0.1:59200:9200"]
    tmpfs: ["/usr/share/opensearch/data:uid=1000,gid=1000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60
