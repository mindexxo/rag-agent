# 개발계 백엔드: 웹 앱 + 워커를 같은 이미지로 함께 띄운다.
# 사전조건: 같은 디렉토리에 .env.dev 준비 (개발계 DB/Redis/vLLM/TEI 값 입력)
#
# 사용:
#   docker compose up -d --build      # 빌드 + 웹·워커 기동
#   docker compose logs -f            # 로그 보기
#   docker compose down               # 내리기
#
# 참고: network_mode: host 라서 컨테이너가 호스트 네트워크를 그대로 쓴다.
#       → 사내망의 vLLM·TEI·DB·Redis 주소에 호스트와 동일하게 접근 가능.
#       → 이 모드에선 ports 매핑이 무시되고 앱이 호스트 8000에 바로 바인딩된다.

services:
  web:
    build: .
    image: consult-agent-backend:local   # 워커가 이 이미지를 재사용 (재빌드 1회)
    env_file: .env.dev
    network_mode: host
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    image: consult-agent-backend:local   # web이 빌드한 동일 이미지 사용
    env_file: .env.dev
    network_mode: host
    restart: unless-stopped
    # 메모리 상한 (#151). 상한이 없으면 docling 변환(#143)이 호스트 메모리를 끝까지 먹고,
    # 호스트 OOM killer가 워커가 아닌 다른 컨테이너를 고를 수도 있다. 상한을 주면 커널이
    # 이 컨테이너만 죽이고 restart 정책이 되살리며, 죽은 사실이 플래그로 남는다:
    #   docker inspect -f '{{.State.OOMKilled}}' <컨테이너>
    # 상한 없이 죽으면 arq 잡이 통째로 사라지고(max_tries=1) outbox 행은 pending인 채 attempts도 안 올라
    # 다음 회차가 같은 문서를 다시 잡는다(rag/outbox.py — 문서 pending을 정리하는 스윕은 없다).
    # 원인이 아무 데도 안 남는다.
    # 3g 근거(2026-09-18, #168 125건 부하 실측 — 리눅스 워커 컨테이너, 운영 docling 설정 그대로): 워커 프로세스는
    # 문서를 거치며 RSS가 1,312→2,3xx MB로 커져 20건쯤에서 평탄해진다. 단일 문서 측정(2026-09-13 피크 1,797MB)은
    # 이 정상상태를 보지 못했다. 125건 정상상태 최대 RSS 2,416MB·캐시 제외 사용량 2,382MB = 2.5g의 93%
    # (OOM은 없었지만 여유 7%). **OCR 유무와 무관하다** — 같은 125건을 OCR 끄고 돌려도 2,391/2,355MB. 원격
    # OCR(#168)이 워커에 얹는 몫은 ~30MB(인프로세스였다면 2,990~3,318MB). 3g면 여유 21%. MALLOC_ARENA_MAX=2는
    # −400~570MB지만 처리 시간이 30~50% 늘어 쓰지 않는다. 호스트(worker20) 여유 43GB.
    # 재조정 근거는 WORKER_METRICS_PORT로 노출되는 process_resident_memory_bytes다.
    mem_limit: 3g
    depends_on:
      - web                               # web 빌드가 이미지를 먼저 만들도록 순서만 보장
    command: ["arq", "rag.worker.WorkerSettings"]
