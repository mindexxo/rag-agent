# Prometheus 스크레이프 대상 (#129). 주소는 .env.dev의 실제 값과 동일하게 유지할 것 —
# 서버 이전 시 여기와 .env.dev를 함께 고친다.
global:
  scrape_interval: 15s

scrape_configs:
  # 앱(FastAPI /metrics — rag/metrics.py: 체감 TTFT·finish_reason).
  # 개발계 백엔드(루트 docker-compose.yml, network_mode: host)가 이 스택과 같은 호스트
  # (worker20)에서 돈다는 전제 — 다른 호스트면 이 타깃만 바꾼다.
  - job_name: kms_app
    static_configs: [{targets: ['localhost:8000']}]

  # vLLM (worker15) — TTFT·e2e 히스토그램, kv_cache_usage_perc, prefix_cache_*, running/waiting
  - job_name: vllm
    static_configs: [{targets: ['10.1.32.15:18888']}]

  # TEI 임베딩·리랭커 (worker15) — te_* 카운터
  - job_name: tei_embed
    static_configs: [{targets: ['10.1.32.15:38889']}]
  - job_name: tei_rerank
    static_configs: [{targets: ['10.1.32.15:38890']}]
