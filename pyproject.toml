# 코드 품질 도구 설정(#302). 판단 기준의 정의점은 AGENTS.md "코드 품질 기준"이고, 강제는 tests/test_code_quality.py
# (래칫 — 기준선 tests/quality_baseline.json보다 나빠지면 실패)가 한다. 버전 고정은 requirements.txt.

[tool.ruff]
line-length = 120          # 실측(main ffed729): 88이면 운영 코드 변경 6.8천 줄, 120이면 4.3천 줄 — 한국어 주석이 긴 저장소라 120
target-version = "py314"   # Dockerfile python:3.14-slim
extend-exclude = ["sample_docs", "serving"]   # 코퍼스 생성 스크립트·Triton 모델 코드 — 앱 코드가 아니다

[tool.ruff.format]
quote-style = "preserve"   # 따옴표 통일은 가독성 이득 없이 변경량만 늘린다(실측 4.9천 → 4.3천 줄)

[tool.ruff.lint]
preview = true
explicit-preview-rules = true   # preview는 PLR1702·PLC2701 때문 — 명시한 preview 규칙만 켠다
select = [
    # ① 자동 강제 — 위반 0이 목표(기존분은 기준선 동결, #303이 일괄 정리)
    "E4", "E7", "E9", "F",   # 문법·미사용 import·미정의 이름
    "I",                     # import 정렬
    "B",                     # 흔한 버그 패턴
    # ② 리뷰 신호 — 기존분은 기준선 동결, 새로 넘으면 래칫이 막는다(책임을 나눌 신호). 상한은 pylint·Ruff 기본값, 중첩만 4
    "C901",                  # 순환 복잡도
    "PLR0911",               # return 개수
    "PLR0912",               # 분기 수
    "PLR0913",               # 인자 수
    "PLR0915",               # 문장 수
    "PLR1702",               # 중첩 블록 깊이
    # ③ 모듈 경계(#310) — 의존 방향은 tests/test_architecture.py, 여기서는 공개 표면과 모듈 설명
    "PLC2701",               # 다른 모듈의 `_이름` import — 경계가 새는 신호(preview, 명시 활성)
    "D100", "D104",          # 모듈·패키지 docstring — "이 모듈이 하는 일을 한 문장으로" 적는 자리
    # ④ 타입(#308) — 판단 기준 5: 시그니처 힌트. 새 파일 전체 검사는 mypy(tests/test_typecheck.py)
    "ANN001", "ANN002", "ANN003",                # 인자 힌트 누락(ruff ANN001은 공개 여부를 안 가린다)·*args·**kwargs
    "ANN201", "ANN204", "ANN205", "ANN206",      # 반환 힌트 누락 — 공개 함수·특수 메서드(__init__ 등)·static·classmethod
]
ignore = [
    "B008",   # 기본값 인자에 함수 호출 — FastAPI Depends 관용구라 오탐(FastAPI도 이 규칙을 끈다)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLC2701", "ANN"]   # 픽스처는 인자로 받는다(인자 수 ≠ 책임 수), 테스트는 내부(`_이름`)를 직접 검사한다, 테스트 함수는 힌트를 달지 않는다
"conftest.py" = ["PLR0913", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "routers", "schemas", "eval", "tests", "config", "database", "text_norm", "main"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 4

[tool.mypy]
# 새 파일 전용(#308) — 기존 파일은 tests/typecheck_baseline.json에 동결하고 tests/test_typecheck.py가 목록 밖 파일만 검사한다.
# 실측(main 31bece0, mypy 2.4.0): 기존 rag/ 51·eval/ 163 오류(엄격 시 rag/ 169) — 기존 코드 적용은 리팩토링 뒤(#308 2단계).
python_version = "3.14"
explicit_package_bases = true   # rag/는 __init__ 없는 네임스페이스 패키지인데 rag/llm/만 패키지라 이게 없으면 모듈 경로를 못 정한다
namespace_packages = true
ignore_missing_imports = true   # 스텁 없는 서드파티 전부(docling·opensearchpy·litellm 등)를 Any로
follow_imports = "silent"       # 새 파일이 import한 기존 모듈의 오류는 세지 않는다 — 새 파일 자신만. 대가: 힌트 없는 기존 함수는 Any로 흐른다
disallow_untyped_defs = true    # 판단 기준 5 — 새 파일은 함수 정의에 힌트 필수
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
